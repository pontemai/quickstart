services:
  web:
    image: ghcr.io/pontemai/quickstart:0.1.0
    restart: unless-stopped
    # The device's own hostname, for the page's device panel.
    uts: host
    ports:
      # Loopback only: the app link reaches it through the connector on the
      # device, and nothing else on the network can.
      - "127.0.0.1:${HOST_PORT}:8080"
    volumes:
      # The device's OS name, for the same panel.
      - type: bind
        source: /etc/os-release
        target: /host/etc/os-release
        read_only: true
        bind:
          create_host_path: false
    environment:
      GREETING: "${GREETING}"
      ADMIN_URL: "${ADMIN_URL}"
      PONTEM_TENANT_ID: "${PONTEM_TENANT_ID}"
      PONTEM_DEVICE_ID: "${PONTEM_DEVICE_ID}"
      PONTEM_PACKAGE_VERSION: "${PONTEM_PACKAGE_VERSION}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
