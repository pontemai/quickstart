namespace: quickstart
description: Config for the Pontem quickstart package
keys:
  GREETING:
    type: string
    default: "Hello World!"
    description: Headline shown on the quickstart page
  ADMIN_URL:
    type: string
    default: ""
    description: Admin app URL for this organization, e.g. https://pontem.acme.com/admin/o/acme. The page links to the device there and calls the Pontem API on the same host.
  API_KEY:
    type: secret
    default:
      secret_id: quickstart-api-key
      version: 1
    description: Service-account key with devices:read, used by the page to read this device from the Pontem API
  HOST_PORT:
    type: integer
    default: 8080
    description: Port on the device the quickstart page listens on
